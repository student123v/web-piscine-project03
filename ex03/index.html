<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors and Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Colors & Opacity</h1>

    <div class="swatch named">Named Color</div>

    <div class="swatch hex">HEX Color</div>

    <div class="swatch rgb">RGB Color</div>

    <div class="swatch rgba">RGBA Color</div>

    <div class="opacity-box">
        <p>Opacity: 0.5</p>
    </div>

    <div class="rgba-box">
        <p>RGBA Background: 0.5</p>
    </div>

</body>
</html>
